name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Neovim ${{ matrix.neovim-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim-version: [v0.9.0, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim-version }}
      - uses: JohnnyMorganz/StyLua@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --check lua tests
      - uses: lunarmodules/luacheck@v1.2.0
        with:
          args: lua tests
      - name: Run smoke tests
        run: make test
